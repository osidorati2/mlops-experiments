[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-classifier-service"
version = "0.1.0"
description = "API для классификации изображений с историей предсказаний в SQLite"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "python-multipart==0.0.20",  # приём файлов через UploadFile
    "pillow==11.1.0",            # проверка, что файл — изображение
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",  # нужен для fastapi.testclient
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
